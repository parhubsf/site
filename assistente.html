<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistente Virtual — Soluções Financeiras e Proteção Empresarial</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0B1A2A;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .agente-container {
    width: 100%; max-width: 500px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 0;
    border-radius: 24px; overflow: hidden;
    box-shadow: 0 40px 100px rgba(0,0,0,0.8), 0 0 0 1px rgba(184,197,208,0.1);
  }

  :root {
    --gold: #00E5FF; --gold-dark: #0097A7;
    --green-wa: #00C853; --green-dark: #009624;
    --bg-chat: #0B141A; --bubble-out: #004D40;
    --bubble-in: #1F2C34; --text-primary: #E9EDEF;
    --text-secondary: #8696A0; --input-bg: #1F2C34;
    --error: #ff4d4d; --success: #00C853;
  }

  .header {
    background: #1F2C34; padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid rgba(184,197,208,0.1);
  }

  .back-btn {
    color: var(--text-secondary); font-size: 20px;
    cursor: pointer; line-height: 1; transition: color 0.2s;
  }
  .back-btn:hover { color: var(--gold); }

  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif; font-size: 16px;
    color: #0a0a0a; letter-spacing: 1px; flex-shrink: 0;
  }

  .header-info { flex: 1; }

  .header-name {
    font-weight: 600; font-size: 15px;
    color: var(--text-primary); letter-spacing: 0.3px;
  }

  .header-status {
    font-size: 12px; color: var(--green-wa);
    display: flex; align-items: center; gap: 4px;
  }

  .status-dot {
    width: 6px; height: 6px;
    background: var(--green-wa); border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .header-actions {
    display: flex; gap: 16px;
    color: var(--text-secondary); font-size: 18px;
  }

  .chat-bg {
    background: var(--bg-chat);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(0,229,255,0.04) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(0,200,83,0.03) 0%, transparent 50%);
    height: 520px; overflow-y: auto;
    padding: 16px 12px;
    display: flex; flex-direction: column; gap: 4px;
    scroll-behavior: smooth;
  }

  .chat-bg::-webkit-scrollbar { width: 4px; }
  .chat-bg::-webkit-scrollbar-track { background: transparent; }
  .chat-bg::-webkit-scrollbar-thumb { background: rgba(184,197,208,0.15); border-radius: 2px; }

  .date-divider { text-align: center; margin: 8px 0; }
  .date-divider span {
    background: rgba(11,26,42,0.9); color: var(--text-secondary);
    font-size: 11px; padding: 4px 10px; border-radius: 6px;
  }

  .bubble-wrap {
    display: flex; flex-direction: column; margin-bottom: 2px;
  }
  .bubble-wrap.out { align-items: flex-end; }
  .bubble-wrap.in  { align-items: flex-start; }

  .bubble {
    max-width: 82%; padding: 8px 12px;
    border-radius: 8px; font-size: 14px;
    line-height: 1.45; position: relative;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .bubble.out {
    background: var(--bubble-out); color: var(--text-primary);
    border-bottom-right-radius: 2px;
  }
  .bubble.in {
    background: var(--bubble-in); color: var(--text-primary);
    border-bottom-left-radius: 2px;
  }

  .bubble-time {
    font-size: 10px; color: var(--text-secondary);
    margin-top: 2px; padding: 0 4px;
  }
  .bubble-wrap.out .bubble-time { text-align: right; }

  .options-wrap {
    display: flex; flex-direction: column; gap: 6px;
    margin-top: 6px; align-items: flex-start;
    animation: fadeIn 0.4s ease;
  }

  .opt-btn {
    background: transparent; border: 1px solid var(--gold);
    color: var(--gold); padding: 8px 16px; border-radius: 20px;
    font-size: 13px; font-family: 'DM Sans', sans-serif;
    cursor: pointer; transition: all 0.2s ease;
    text-align: left; white-space: nowrap;
  }
  .opt-btn:hover { background: var(--gold); color: #0A1A2B; font-weight: 600; }
  .opt-btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

  .typing {
    background: var(--bubble-in); padding: 10px 14px;
    border-radius: 8px; border-bottom-left-radius: 2px;
    display: inline-flex; gap: 4px; align-items: center;
    animation: fadeIn 0.2s ease;
  }
  .typing span {
    width: 6px; height: 6px; background: var(--text-secondary);
    border-radius: 50%; animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
  }

  .input-area {
    background: #0B141A; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 6px;
    border-top: 1px solid rgba(184,197,208,0.08);
  }

  .validation-msg {
    font-size: 11px; padding: 0 14px;
    height: 0; overflow: hidden;
    transition: height 0.2s ease, opacity 0.2s ease;
    opacity: 0; color: var(--error);
  }
  .validation-msg.visible { height: 16px; opacity: 1; }
  .validation-msg.success-msg { color: var(--success); }

  .input-row {
    display: flex; align-items: center; gap: 8px;
  }

  .input-wrap {
    flex: 1; background: var(--input-bg); border-radius: 24px;
    display: flex; align-items: center; padding: 8px 14px; gap: 8px;
    border: 1.5px solid transparent;
    transition: border-color 0.25s ease;
  }

  .input-wrap.valid   { border-color: rgba(0,200,83,0.5); }
  .input-wrap.invalid { border-color: rgba(255,77,77,0.6); }

  .input-emoji { color: var(--text-secondary); font-size: 20px; cursor: pointer; }

  #user-input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text-primary); font-family: 'DM Sans', sans-serif;
    font-size: 14px; resize: none; height: 20px; line-height: 20px;
  }
  #user-input::placeholder { color: var(--text-secondary); }
  #user-input:disabled { opacity: 0.5; }

  .input-attach { color: var(--text-secondary); font-size: 20px; cursor: pointer; }

  .send-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--gold); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .send-btn:hover { background: #33EAFF; transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .send-btn:disabled:hover { transform: none; background: var(--gold); }
  .send-btn svg { width: 18px; height: 18px; fill: #0A1A2B; }

  .free-text-badge {
    background: rgba(0,229,255,0.1);
    border: 1px solid rgba(0,229,255,0.3);
    color: var(--gold); font-size: 11px;
    padding: 4px 12px; border-radius: 20px;
    text-align: center; margin: 6px auto; display: table;
  }

  .reset-bar { background: #0B141A; padding: 6px; text-align: center; }
  .reset-btn {
    background: none; border: none; color: var(--text-secondary);
    font-size: 11px; cursor: pointer; font-family: 'DM Sans', sans-serif;
    letter-spacing: 0.5px;
  }
  .reset-btn:hover { color: var(--gold); }

  .lead-card {
    background: linear-gradient(135deg, rgba(0,229,255,0.12), rgba(0,151,167,0.08));
    border: 1px solid rgba(0,229,255,0.3);
    border-radius: 10px; padding: 12px; margin-top: 4px;
    font-size: 13px; color: var(--text-primary); line-height: 1.7;
  }

  .lead-card-title {
    font-family: 'Bebas Neue', sans-serif; font-size: 14px;
    color: var(--gold); letter-spacing: 1px; margin-bottom: 6px;
  }

  .final-badge {
    background: linear-gradient(135deg, rgba(0,200,83,0.12), rgba(0,150,36,0.08));
    border: 1px solid rgba(0,200,83,0.3);
    border-radius: 12px; padding: 14px 16px; margin-top: 8px;
    text-align: center; animation: fadeIn 0.5s ease;
  }
  .final-badge-icon { font-size: 28px; margin-bottom: 6px; }
  .final-badge-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px; color: #00C853; letter-spacing: 1.5px; margin-bottom: 6px;
  }
  .final-badge-text { font-size: 13px; color: #E9EDEF; line-height: 1.6; }

  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #1F2C34; border: 1px solid rgba(0,200,83,0.4);
    color: #E9EDEF; font-size: 13px; padding: 10px 20px;
    border-radius: 30px; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    transition: transform 0.4s ease; z-index: 9999;
    display: flex; align-items: center; gap: 8px;
  }
  .toast.visible { transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: rgba(255,77,77,0.4); }

  .admin-toggle {
    position: fixed; bottom: 24px; right: 24px;
    background: linear-gradient(135deg, #0097A7, #00E5FF);
    border: none; border-radius: 50%;
    width: 52px; height: 52px; font-size: 22px;
    cursor: pointer; box-shadow: 0 4px 20px rgba(0,229,255,0.3);
    z-index: 1000; transition: transform 0.2s;
    color: #0A1A2B;
  }
  .admin-toggle:hover { transform: scale(1.1); }

  .admin-panel {
    position: fixed; top: 0; right: 0;
    width: 380px; height: 100vh;
    background: #0A1A2B; border-left: 1px solid #1F2C34;
    z-index: 999; display: none; flex-direction: column;
    overflow: hidden; box-shadow: -10px 0 40px rgba(0,0,0,0.6);
  }
  .admin-panel.open { display: flex; }

  .admin-header {
    background: #0F2137; padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #1F2C34;
  }
  .admin-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--gold); letter-spacing: 2px; }
  .admin-close { background: none; border: none; color: #8696A0; font-size: 20px; cursor: pointer; }

  .admin-tabs { display: flex; border-bottom: 1px solid #1F2C34; }
  .admin-tab {
    flex: 1; padding: 10px; background: none; border: none;
    color: #8696A0; font-family: 'DM Sans', sans-serif;
    font-size: 12px; font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase; cursor: pointer;
    border-bottom: 2px solid transparent; transition: all 0.2s;
  }
  .admin-tab.active { color: var(--gold); border-bottom-color: var(--gold); background: rgba(0,229,255,0.05); }

  .admin-body { flex: 1; overflow-y: auto; padding: 16px; }
  .admin-body::-webkit-scrollbar { width: 4px; }
  .admin-body::-webkit-scrollbar-thumb { background: #1F2C34; border-radius: 2px; }

  .admin-section { display: none; }
  .admin-section.active { display: block; }

  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 11px; color: #8696A0; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .form-input {
    width: 100%; background: #0F2137; border: 1px solid #1F2C34;
    border-radius: 8px; padding: 9px 12px; color: #E9EDEF;
    font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--gold); }
  .form-row { display: flex; gap: 10px; }
  .form-row .form-group { flex: 1; }

  .btn-primary {
    width: 100%; background: linear-gradient(135deg, #0097A7, #00E5FF);
    border: none; border-radius: 8px; padding: 10px; color: #0A1A2B;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: opacity 0.2s;
  }
  .btn-primary:hover { opacity: 0.9; }

  .parceiro-card { background: #0F2137; border: 1px solid #1F2C34; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .parceiro-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .parceiro-nome { font-size: 14px; font-weight: 600; color: #E9EDEF; }
  .parceiro-tipo { font-size: 10px; color: #8696A0; margin-top: 2px; }
  .parceiro-taxa { background: rgba(0,229,255,0.15); border: 1px solid rgba(0,229,255,0.3); color: var(--gold); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
  .parceiro-stats { display: flex; gap: 12px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #1F2C34; }
  .stat-item { flex: 1; }
  .stat-label { font-size: 10px; color: #8696A0; }
  .stat-value { font-size: 13px; font-weight: 600; color: #E9EDEF; }
  .parceiro-actions { display: flex; gap: 6px; margin-top: 8px; }
  .btn-sm { flex: 1; background: none; border: 1px solid #1F2C34; border-radius: 6px; padding: 5px 8px; color: #8696A0; font-size: 11px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
  .btn-sm:hover { border-color: var(--gold); color: var(--gold); }
  .btn-sm.danger:hover { border-color: #f85149; color: #f85149; }

  .lead-item { background: #0F2137; border: 1px solid #1F2C34; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .lead-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .lead-nome { font-size: 13px; font-weight: 600; color: #E9EDEF; }
  .lead-time { font-size: 10px; color: #8696A0; }
  .lead-empresa { font-size: 12px; color: #8696A0; margin-bottom: 6px; }
  .lead-comissao { display: inline-flex; align-items: center; gap: 4px; background: rgba(0,200,83,0.1); border: 1px solid rgba(0,200,83,0.25); color: #00C853; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
  .empty-state { text-align: center; padding: 40px 20px; color: #8696A0; font-size: 13px; }
  .empty-state .icon { font-size: 32px; margin-bottom: 8px; }

  @media (max-width: 768px) {
    .agente-container { max-width: 100%; }
  }
</style>
</head>
<body>

<div class="toast" id="toast">
  <span id="toast-icon">✅</span>
  <span id="toast-text">E-mail enviado com sucesso!</span>
</div>

<div class="agente-container">
  <div class="header">
    <div class="avatar">AV</div>
    <div class="header-info">
      <div class="header-name">Assistente Virtual</div>
      <div class="header-status">
        <div class="status-dot"></div>
        online agora
      </div>
    </div>
    <div class="header-actions">
      <span>📞</span>
      <span>⋮</span>
    </div>
  </div>

  <div class="chat-bg" id="chat">
    <div class="date-divider"><span>Hoje</span></div>
  </div>

  <div class="input-area">
    <div class="validation-msg" id="validation-msg"></div>
    <div class="input-row">
      <div class="input-wrap" id="input-wrap">
        <span class="input-emoji">😊</span>
        <input type="text" id="user-input" placeholder="Digite uma mensagem..." disabled oninput="onInputChange(this)" />
        <span class="input-attach">📎</span>
      </div>
      <button class="send-btn" id="send-btn" onclick="sendUserMessage()" disabled>
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <div class="reset-bar">
    <button class="reset-btn" onclick="resetChat()">↺ Reiniciar conversa</button>
  </div>
</div>

<button class="admin-toggle" onclick="toggleAdmin()" title="Painel de Parceiros">⚙️</button>

<div class="admin-panel" id="adminPanel">
  <div class="admin-header">
    <div class="admin-title">⚙️ PAINEL ADMIN</div>
    <button class="admin-close" onclick="toggleAdmin()">✕</button>
  </div>
  <div class="admin-tabs">
    <button class="admin-tab active" onclick="switchTab('parceiros')">👥 Parceiros</button>
    <button class="admin-tab" onclick="switchTab('leads')">📋 Leads</button>
    <button class="admin-tab" onclick="switchTab('comissoes')">💰 Comissões</button>
  </div>
  <div class="admin-body">
    <div class="admin-section active" id="tab-parceiros">
      <div class="form-group" style="margin-bottom:16px;">
        <div style="font-size:12px;color:#8696A0;margin-bottom:12px;">Cadastrar novo parceiro:</div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Nome</label>
            <input class="form-input" id="p-nome" placeholder="Ex: Dr. Carlos Silva">
          </div>
          <div class="form-group">
            <label class="form-label">Tipo</label>
            <select class="form-input" id="p-tipo">
              <option>Advogado</option>
              <option>Contador</option>
              <option>Consultor</option>
              <option>Outro</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Taxa de Comissão (%)</label>
            <input class="form-input" id="p-taxa" type="number" placeholder="Ex: 20" min="0" max="100" step="0.5">
          </div>
          <div class="form-group">
            <label class="form-label">WhatsApp</label>
            <input class="form-input" id="p-whatsapp" placeholder="(11) 99999-9999">
          </div>
        </div>
        <button class="btn-primary" onclick="cadastrarParceiro()">➕ Cadastrar Parceiro</button>
      </div>
      <div style="font-size:11px;color:#8696A0;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;">Parceiros Ativos</div>
      <div id="lista-parceiros">
        <div class="empty-state"><div class="icon">👥</div>Nenhum parceiro cadastrado ainda.</div>
      </div>
    </div>
    <div class="admin-section" id="tab-leads">
      <div style="font-size:11px;color:#8696A0;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;">Leads Capturados</div>
      <div id="lista-leads">
        <div class="empty-state"><div class="icon">📋</div>Nenhum lead capturado ainda.</div>
      </div>
    </div>
    <div class="admin-section" id="tab-comissoes">
      <div id="resumo-comissoes">
        <div class="empty-state"><div class="icon">💰</div>Em desenvolvimento</div>
      </div>
    </div>
  </div>
</div>

<script>
const DESTINO_LEADS_EMAIL = 'Thalyson@parhub.com.br';
const FORM_SUBMIT_ENDPOINT = `https://formsubmit.co/ajax/${DESTINO_LEADS_EMAIL}`;
const LINK_ABERTURA = 'https://www.parhub.com.br/#contato';

const SYSTEM_PROMPT = `Você é o assistente virtual especializado em soluções financeiras e proteção empresarial.

Seu objetivo é responder dúvidas do cliente de forma empática, clara e direta. O cliente busca soluções para proteger e alavancar seu negócio.

Regras:
- Nunca prometa prazos além de 24h úteis para retorno da equipe
- Nunca dê informações jurídicas ou fiscais detalhadas — diga que um especialista vai orientar
- Se perguntado sobre custos ou taxas, diga que um consultor vai apresentar as condições personalizadas
- Use linguagem simples, sem jargão técnico
- Seja conciso — respostas curtas e diretas, no estilo WhatsApp
- Sempre termine incentivando o cliente a continuar o processo

Sobre o nosso serviço:
- Soluções financeiras sob medida para empresas com bloqueios judiciais, fiscais e Bacen Jud
- Soluções com PIX liberado e operação financeira ativa
- Processo simples: enviar e-mail, CNPJ e razão social
- Soluções legais e estruturadas
- Atendimento em até 24h úteis

Responda APENAS a dúvida do usuário, em no máximo 3 linhas curtas. Não repita o fluxo de perguntas — isso é feito pelo sistema.`;

const TABELA_CUSTOS = [
  { label: 'Solução Empresarial', valor: 'Sob consulta', desc: 'Taxa de abertura única' },
  { label: 'TED',    valor: 'R$ 4,99',  desc: 'Por transferência' },
  { label: 'PIX',    valor: 'R$ 3,99',  desc: 'Por transação' },
  { label: 'Boleto', valor: 'R$ 4,99',  desc: 'Por emissão' },
  { label: 'Movimentação (entrada)', valor: '1,20%', desc: 'Sobre o que entra na conta' },
];

let step = 0;
let userData = {};
let conversationHistory = [];
let chatIniciado = false;
let collectingField = null;
let inputValid = true;

const steps = [
  {
    type: 'bot',
    text: 'Olá! 👋 Bem-vindo à *nossa central de atendimento*.\n\nSomos especializados em soluções financeiras e proteção para empresas. Posso te ajudar?',
    options: ['✅ Sim, pode perguntar']
  },
  {
    type: 'bot',
    text: 'Ótimo! Para começar, qual é o seu *nome completo*?',
    freeText: true, collect: 'nomeContato',
    validate: 'nome',
    placeholder: 'Seu nome completo...'
  },
  {

function somenteNumeros(v) { return v.replace(/\D/g, ''); }
function mascaraTelefone(v) {
  v = somenteNumeros(v); v = v.slice(0, 11);
  if (v.length === 0) return '';
  if (v.length < 3) return `(${v}`;
  if (v.length < 7) return `(${v.slice(0, 2)}) ${v.slice(2)}`;
  if (v.length < 11) return `(${v.slice(0, 2)}) ${v.slice(2, 6)}-${v.slice(6)}`;
  return `(${v.slice(0, 2)}) ${v.slice(2, 7)}-${v.slice(7)}`;
}
function mascaraCNPJ(v) {
  v = somenteNumeros(v);
  return v.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2').slice(0, 18);
}
function validarCNPJ(cnpj) {
  const numeros = somenteNumeros(cnpj);
  return numeros.length === 14 && !/^(\d)\1{13}$/.test(numeros);
}
function validarEmail(email) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.trim()); }
function validarTelefone(tel) { const n = somenteNumeros(tel); return n.length >= 10 && n.length <= 11; }
function validarNome(nome) { return nome.trim().split(/\s+/).filter(p => p.length >= 2).length >= 1; }

function processarInput(value, tipo) {
  let masked = value; let isValid = true; let errorMsg = '';
  switch (tipo) {
    case 'telefone':
      masked = mascaraTelefone(value);
      isValid = validarTelefone(masked);
      if (!isValid && masked.length > 4) errorMsg = '⚠️ Telefone inválido. Ex: (11) 99999-9999';
      break;
    case 'cnpj':
      masked = mascaraCNPJ(value);
      const cnpjNums = somenteNumeros(masked);
      if (cnpjNums.length === 14) { isValid = validarCNPJ(masked); errorMsg = isValid ? '' : '❌ CNPJ inválido. Use o formato 00.000.000/0000-00.'; }
      else { isValid = false; }
      break;
    case 'email':
      masked = value; isValid = validarEmail(value);
      if (!isValid && value.includes('@')) errorMsg = '⚠️ E-mail inválido. Ex: nome@empresa.com';
      break;
    case 'nome':
      masked = value; isValid = validarNome(value);
      if (!isValid && value.length > 3) errorMsg = '⚠️ Digite pelo menos um nome válido.';
      break;
    case 'none': default: isValid = value.trim().length > 0; break;
  }
  return { masked, isValid, errorMsg };
}

function onInputChange(input) {
  if (!collectingField) return;
  const currentStep = steps.find(s => s.collect === collectingField);
  if (!currentStep || !currentStep.validate) return;
  const tipo = currentStep.validate;
  const cursorOriginal = input.selectionStart ?? input.value.length;
  const digitsBeforeCursor = somenteNumeros(input.value.slice(0, cursorOriginal)).length;
  const { masked, isValid, errorMsg } = processarInput(input.value, tipo);
  input.value = masked;
  if (tipo === 'telefone' || tipo === 'cnpj') {
    let novoCursor = masked.length; let totalDigitos = 0;
    for (let i = 0; i < masked.length; i++) { if (/\d/.test(masked[i])) totalDigitos++; if (totalDigitos >= digitsBeforeCursor) { novoCursor = i + 1; break; } }
    try { input.setSelectionRange(novoCursor, novoCursor); } catch(e) {}
  }
  const wrap = document.getElementById('input-wrap'); const msg = document.getElementById('validation-msg');
  if (masked.length === 0) { wrap.classList.remove('valid', 'invalid'); msg.textContent = ''; msg.classList.remove('visible', 'success-msg'); inputValid = false; return; }
  if (isValid) { wrap.classList.add('valid'); wrap.classList.remove('invalid'); msg.textContent = ''; msg.classList.remove('visible'); inputValid = true; }
  else { wrap.classList.add('invalid'); wrap.classList.remove('valid'); if (errorMsg) { msg.textContent = errorMsg; msg.classList.add('visible'); msg.classList.remove('success-msg'); } else { msg.textContent = ''; msg.classList.remove('visible'); } inputValid = false; }
}
function clearValidationUI() {
  const wrap = document.getElementById('input-wrap'); const msg = document.getElementById('validation-msg');
  wrap.classList.remove('valid', 'invalid'); msg.textContent = ''; msg.classList.remove('visible', 'success-msg'); inputValid = true;
}

  if (window.location.protocol === 'file:') { console.warn('⚠️ O envio de leads só funciona em ambiente web, como GitHub Pages.'); showToast('⚠️', 'O envio por e-mail funciona no GitHub Pages, não no arquivo local.', true); return; }
  const dataCadastro = new Date().toLocaleString('pt-BR', { dateStyle: 'full', timeStyle: 'short' });
  const resumo = `Nome: ${data.nomeContato || '—'}\nTelefone: ${data.telefone || '—'}\nE-mail: ${data.email || '—'}\nCNPJ: ${data.cnpj || '—'}\nRazão Social: ${data.razao || '—'}\nTipo de Restrição: ${data.tipoRestricao || '—'}\nParceiro: ${data.parceiro || 'Sem indicação'}\nData: ${dataCadastro}`;
  const payload = {
    nome: data.nomeContato || '—', telefone: data.telefone || '—', email: data.email || '—',
    cnpj: data.cnpj || '—', razao_social: data.razao || '—', tipo_restricao: data.tipoRestricao || '—',
    parceiro: data.parceiro || 'Sem indicação',
    data_cadastro: dataCadastro, resumo_cadastro: resumo,
    _subject: `Novo lead - ${data.nomeContato || 'Sem nome'}`, _replyto: data.email || DESTINO_LEADS_EMAIL,
    _template: 'table', _captcha: 'false', _url: window.location.href
  };
  try {
    const response = await fetch(FORM_SUBMIT_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(payload) });
    const result = await response.json().catch(() => null);
    if (!response.ok || (result && result.success === 'false')) throw new Error(result?.message || 'Falha ao enviar o resumo.');
    showToast('✅', 'Lead enviado por e-mail com sucesso!');
  } catch (err) { console.error('Erro ao enviar e-mail:', err); showToast('⚠️', 'Erro ao enviar e-mail. Confirme o formulário no FormSubmit.', true); }
}

function sendUserMessage() {
  const input = document.getElementById('user-input'); const text = input.value.trim(); if (!text) return;

    if (currentStep && currentStep.validate && currentStep.validate !== 'none') {

      if (!isValid) { const msg = document.getElementById('validation-msg'); const wrap = document.getElementById('input-wrap'); msg.textContent = errorMsg || '⚠️ Dado inválido. Verifique e tente novamente.'; msg.classList.add('visible'); msg.classList.remove('success-msg'); wrap.classList.add('invalid'); wrap.classList.remove('valid'); input.focus(); return; }

  if (step >= steps.length) return; const current = steps[step]; showTyping();

    addBubble(current.text, 'in');
    if (current.options) { addOptions(current.options); step++; }
    else if (current.freeText) { collectingField = current.collect; step++; enableInput(current.placeholder); }

function isCostQuestion(text) { const keywords = ['custo', 'taxa', 'tarifa', 'preço', 'valor', 'mensalidade', 'quanto', 'pagar']; return keywords.some(k => text.toLowerCase().includes(k)); }
async function handleFreeQuestion(question) {
  showTyping(); conversationHistory.push({ role: 'user', content: question }); const isCost = isCostQuestion(question);
  try {
    const reply = gerarRespostaLocal(question); conversationHistory.push({ role: 'assistant', content: reply }); removeTyping(); addBubble(reply, 'in');
    if (isCost) setTimeout(() => showTabelaCustos(), 500);
    setTimeout(() => {
      const chat = document.getElementById('chat'); const badge = document.createElement('div'); badge.className = 'free-text-badge'; badge.textContent = 'Mais dúvidas? Pode perguntar ou continue 👇'; chat.appendChild(badge);

      continueBtn.onclick = () => { opts.remove(); badge.remove(); disableInput(); setTimeout(() => processStep(), 400); }; opts.appendChild(continueBtn); chat.appendChild(opts); scrollBottom();
    }, isCost ? 1200 : 400);
  } catch (err) { removeTyping(); addBubble('Desculpe, tive um problema técnico.', 'in'); enableInput(); }
}
function gerarRespostaLocal(question) {
  const texto = question.toLowerCase();
  if (/(pix|transfer|ted|boleto|movimenta)/.test(texto)) return 'Sim, podemos operar com PIX, TED e boleto. Se quiser, seguimos com o cadastro para análise.';
  if (/(prazo|quando|retorno|tempo|demora|24h)/.test(texto)) return 'Após o cadastro, nossa equipe faz o retorno em até 24 horas úteis. Se quiser, podemos concluir seus dados agora.';
  if (/(custo|taxa|tarifa|preço|valor|mensalidade|quanto)/.test(texto)) return 'Os custos são apresentados de forma personalizada por um consultor. Posso te mostrar a tabela base e seguir com o cadastro.';
  if (/(bloqueio|judicial|fiscal|bacen|restri)/.test(texto)) return 'Atuamos justamente em cenários de bloqueio judicial, fiscal e Bacen Jud. Vamos seguir com seus dados para a equipe analisar o caso.';
  if (/(documento|documentação|documentos|cnpj|raz[aã]o social|email)/.test(texto)) return 'Para iniciar, normalmente precisamos do e-mail, CNPJ e razão social da empresa. Posso continuar seu cadastro por aqui.';
  if (/(consultor|atendente|humano|pessoa)/.test(texto)) return 'Claro. Assim que o cadastro for concluído, um consultor pode assumir o atendimento com o seu caso em mãos.';
  if (/(seguro|seguran[aç]a|confi[aá]vel|legal)/.test(texto)) return 'Sim, trabalhamos de forma legal e estruturada. Nosso time especializado orienta cada caso com segurança.';
  return 'Posso te ajudar com bloqueio, operação da conta, prazo de retorno e documentos iniciais. Se preferir, continue o cadastro que nossa equipe assume daqui.';
}

  const el = document.getElementById('lista-leads');
  if (!leads.length) { el.innerHTML = '<div class="empty-state"><div class="icon">📋</div>Nenhum lead</div>'; return; }
  el.innerHTML = [...leads].reverse().map(l => `<div class="lead-item"><div class="lead-item-top"><div class="lead-nome">👤 ${l.nome || '—'}</div><div class="lead-time">${l.hora || '—'}</div></div><div class="lead-empresa">🏢 ${l.razao || '—'} • ${l.cnpj || '—'}</div><div style="font-size:12px;color:#8696A0;">📱 ${l.telefone || '—'} • 📧 ${l.email || '—'}</div>${l.parceiro ? `<div style="font-size:12px;color:#8696A0;">🤝 Parceiro: ${l.parceiro}</div>` : ''}</div>`).join('');
}
function renderComissoes() { document.getElementById('resumo-comissoes').innerHTML = '<div class="empty-state"><div class="icon">💰</div>Em desenvolvimento</div>'; }
function registrarLeadNoPainel(data) {
  const lead = { id: Date.now(), nome: data.nomeContato, telefone: data.telefone, email: data.email, cnpj: data.cnpj, razao: data.razao, tipoRestricao: data.tipoRestricao || null, parceiro: data.parceiro || null, hora: new Date().toLocaleString('pt-BR') };
  leads.push(lead); salvarDados();
}

// Inicializar o chat
setTimeout(() => { processStep(); chatIniciado = true; }, 500);
</script>
